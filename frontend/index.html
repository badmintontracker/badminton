<!DOCTYPE html>
<html>
<head>
  <title>Badminton Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Badminton Tracker</h1>

  <!-- Login Section -->
  <div id="loginSection">
    <h2>Admin Login</h2>
    <input id="username" placeholder="Username"><br>
    <input id="password" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <p id="loginMsg"></p>
  </div>

  <!-- Admin Section -->
  <div id="adminSection" style="display:none;">
    <h2>Add Deposit</h2>
    <input id="depositPlayer" placeholder="Player">
    <input id="depositAmount" type="number" placeholder="Amount">
    <input id="depositDate" type="date">
    <button onclick="addDeposit()">Add Deposit</button>

    <h2>Add Session</h2>
    <input id="sessionDate" type="date">
    <input id="sessionCourt" type="number" placeholder="Court Cost">
    <input id="sessionShuttle" type="number" placeholder="Shuttle Cost">
    <input id="sessionAttendees" placeholder="Attendees (comma separated)">
    <button onclick="addSession()">Add Session</button>
  </div>

  <!-- Reports Section -->
  <div id="reportsSection">
    <h2>Reports</h2>
    <button onclick="loadReports()">Refresh Reports</button>
    <div id="balances"></div>
    <div id="playerHistories"></div>
    <div id="sessions"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
