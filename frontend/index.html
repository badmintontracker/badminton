<!DOCTYPE html>
<html>
<head>
  <title>Badminton Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #login, #app { margin-bottom: 20px; }
    .hidden { display: none; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #f4f4f4; }
    .negative { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🏸 Badminton Tracker</h1>

  <div id="login">
    <h2>Admin Login</h2>
    <input id="username" placeholder="Username"><br>
    <input id="password" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <p id="loginError" style="color:red"></p>
  </div>

  <div id="app" class="hidden">
    <h2>Dashboard</h2>
    <button onclick="loadPlayers()">Players</button>
    <button onclick="loadSessions()">Sessions</button>
    <button onclick="loadReport()">Reports</button>
    <div id="content"></div>
  </div>

  <div id="report">
    <h2>Public Reports</h2>
    <div id="reportContent"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
