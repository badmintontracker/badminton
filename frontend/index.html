<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Badminton Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Badminton Tracker</h1>

  <section>
    <h2>Sessions</h2>
    <table id="sessionsTable" border="1">
      <thead>
        <tr><th>Date</th><th>Court</th><th>Shuttle</th><th>Attendees</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>Player Balances</h2>
    <table id="reportTable" border="1">
      <thead>
        <tr><th>Player</th><th>Deposit</th><th>Balance</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script src="script.js"></script>
</body>
</html>
