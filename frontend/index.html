<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Badminton Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🏸 Badminton Tracker</h1>

  <!-- Login -->
  <div id="loginSection">
    <h2>Login (Admin Only)</h2>
    <input type="text" id="username" placeholder="Username"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <p id="loginMsg"></p>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel" style="display:none;">
    <h2>Admin Panel</h2>
    <p>Welcome, Admin! (Here you can later add players, sessions, etc.)</p>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- Reports Section -->
  <div id="reportsSection">
    <h2>📊 Reports</h2>

    <h3>Sessions Report</h3>
    <table border="1" id="sessionReport">
      <tr><th>Date</th><th>Attendees</th></tr>
    </table>

    <h3>Player Report</h3>
    <table border="1" id="playerReport">
      <tr><th>Player</th><th>Deposit</th><th>Sessions Attended</th></tr>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
