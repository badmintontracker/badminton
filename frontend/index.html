<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Badminton Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginSection">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required><br>
      <input type="password" id="password" placeholder="Password" required><br>
      <button type="submit">Login</button>
    </form>
    <p id="loginError" class="error"></p>
  </div>

  <div id="dashboard" class="hidden">
    <h1>Badminton Club Dashboard</h1>
    <button id="logoutBtn">Logout</button>

    <h2>Players</h2>
    <ul id="playersList"></ul>

    <h2>Add Player</h2>
    <form id="playerForm">
      <input type="text" id="playerName" placeholder="Player Name" required>
      <button type="submit">Add</button>
    </form>

    <h2>Add Deposit</h2>
    <form id="depositForm">
      <select id="depositPlayer"></select>
      <input type="number" id="depositAmount" placeholder="Amount" required>
      <button type="submit">Deposit</button>
    </form>

    <h2>Add Session</h2>
    <form id="sessionForm">
      <input type="date" id="sessionDate" required>
      <input type="number" id="courtCost" placeholder="Court Cost" required>
      <input type="number" id="shuttleCost" placeholder="Shuttle Cost" required>
      <label>Select Attendees:</label><br>
      <div id="attendeesCheckboxes"></div>
      <button type="submit">Save Session</button>
    </form>
  </div>

  <div id="reports">
    <h2>Reports</h2>
    <button id="exportBtn">Export Balances</button>
    <h3>Sessions</h3>
    <table id="sessionsTable">
      <thead><tr><th>Date</th><th>Court</th><th>Shuttle</th><th>Attendees</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
