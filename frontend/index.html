<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Badminton Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🏸 Badminton Tracker</h1>

  <div id="loginSection">
    <h2>Login</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="loginStatus"></p>
  </div>

  <div id="app" style="display:none;">
    <h2>Players</h2>
    <input id="playerName" placeholder="Player name">
    <input id="playerDeposit" placeholder="Deposit" type="number">
    <button onclick="addPlayer()">Add Player</button>
    <ul id="playersList"></ul>

    <h2>Sessions</h2>
    <button onclick="loadSessions()">Refresh Sessions</button>
    <table border="1" id="sessionsTable"></table>

    <h2>Reports</h2>
    <button onclick="loadReport()">Player-wise Report</button>
    <table border="1" id="reportTable"></table>
  </div>

  <script src="script.js"></script>
</body>
</html>
