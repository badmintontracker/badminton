<!DOCTYPE html>
<html>
<head>
  <title>Badminton Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
  <h2>🏸 Badminton Tracker</h2>

  <!-- Add Player -->
  <h4>Add Player</h4>
  <input id="playerName" placeholder="Player Name">
  <input id="playerDeposit" type="number" placeholder="Deposit">
  <button class="btn btn-primary btn-sm" onclick="addPlayer()">Add</button>

  <!-- Players Table -->
  <h4>Players</h4>
  <table class="table table-striped" id="playersTable"></table>

  <!-- Record Multi-Player Session -->
  <h4>Record Session</h4>
  <label>Select Players:</label><br>
  <select id="sessionPlayers" multiple size="5" class="form-select w-50 mb-2"></select><br>
  <input type="number" id="sessionCourtCost" placeholder="Court Cost">
  <input type="number" id="sessionShuttleCost" placeholder="Shuttle Cost">
  <input type="date" id="sessionDate">
  <button class="btn btn-success btn-sm" onclick="addSession()">Add Session</button>

  <!-- Daily Report -->
  <h3>📊 Daily Report</h3>
  <div id="dailyReport"></div>

  <!-- Final Balances -->
  <h3>🏸 Final Balances</h3>
  <table class="table table-bordered" id="balanceTable"></table>

  <script src="script.js"></script>
</body>
</html>
