<!DOCTYPE html>
<html>
<head>
  <title>Badminton Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .hidden { display: none; }
    .negative { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Badminton Tracker</h2>

  <!-- Login -->
  <div id="loginSection">
    <h3>Login</h3>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="loginMsg"></p>
  </div>

  <!-- Admin -->
  <div id="adminSection" class="hidden">
    <h3>Add Player</h3>
    <input id="playerName" placeholder="Name">
    <input id="playerDeposit" type="number" placeholder="Deposit">
    <button onclick="addPlayer()">Add Player</button>

    <h3>Add Session</h3>
    <input id="sessionDate" type="date">
    <input id="sessionCourt" type="number" placeholder="Court Cost">
    <input id="sessionShuttle" type="number" placeholder="Shuttle Cost">
    <input id="sessionAttendees" placeholder="Comma-separated players">
    <button onclick="addSession()">Add Session</button>
  </div>

  <!-- Reports -->
  <div id="reportSection">
    <h3>Reports</h3>
    <button onclick="loadReport()">Load Report</button>
    <div id="reportTable"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
